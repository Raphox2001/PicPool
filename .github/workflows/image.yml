# ---------------------------------------------------------------------------
# Baut das Container-Image und legt es in der GitHub Container Registry ab.
#
# Damit muss auf der NAS nichts mehr gebaut werden: docker compose zieht das
# fertige Image. Das Bauen auf einer DS923+ dauerte mehrere Minuten und
# verlangte Arbeitsspeicher, den die NAS neben den anderen Containern kaum hat.
#
# Ergebnis: ghcr.io/raphox2001/picpool:latest  (und :1.2.3 je Release)
#
# Bei einem Tag entsteht ausserdem ein GitHub-Release. Das ist keine Kosmetik:
# Der Aktualisierungsknopf im Adminpanel fragt releases/latest ab, und ein Tag
# allein taucht dort nicht auf. Ohne Release bleibt der Knopf blind - genau das
# war bis 0.4.1 der Fall, das Panel sah an drei Versionen vorbei.
# ---------------------------------------------------------------------------

name: Image veroeffentlichen

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/raphox2001/picpool
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Nur amd64: Synology-Modelle mit x86-Prozessor (DS923+ und
          # Verwandte). Fuer die ARM-Modelle muesste hier linux/arm64 dazu -
          # das verdoppelt die Bauzeit, weil es unter QEMU emuliert wird.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Release zum Tag anlegen.
  #
  # Erst wenn das Image steht: Ein Release, zu dem es kein Image gibt, wuerde
  # auf der NAS einen Pull ins Leere ausloesen - das Panel bietet die
  # Aktualisierung an, und docker compose pull findet sie nicht.
  #
  # Ein vorhandenes Release wird nicht angetastet, ein erneuter Lauf desselben
  # Tags ist also gefahrlos.
  #
  # Fuer Tags, die VOR dieser Aenderung entstanden sind, hilft das nicht:
  # "Run workflow" benutzt die Workflow-Datei des gewaehlten Refs, und dort
  # fehlt dieser Job noch. Deren Release muss von Hand angelegt werden - oder
  # man laesst es, denn fuer die Versionspruefung zaehlt nur das neueste.
  # -------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie, damit die Notizen aus den Commits entstehen koennen.
          fetch-depth: 0

      - name: Release anlegen, falls noch keines existiert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag existiert bereits - nichts zu tun."
            exit 0
          fi
          gh release create "$tag" --title "PicPool $tag" --generate-notes
